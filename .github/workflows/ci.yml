name: Browser extension tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify extension tests
        run: npm test
      - name: Validate JavaScript and manifest
        run: |
          node --check src/background.js
          node --check src/rules.js
          node --check src/popup.js
          node -e 'const m=require("./manifest.json"); if(m.manifest_version!==3) process.exit(1)'
